<!doctype html><html lang="ko"><meta charset="utf-8"><title>DiscoJ</title>
<style>
body{width:300px;font:13px/1.5 system-ui,sans-serif;padding:14px;margin:0;color:#202124;background:#fff}
h1{font-size:15px;margin:0 0 12px}#connection{font-weight:600;padding:10px;border-radius:8px;background:#f1f3f4}
#connection[data-state="online"]{color:#176633;background:#e8f5eb}#connection[data-state="other"],#connection[data-state="offline"]{color:#885a00;background:#fff4da}
#title{overflow-wrap:anywhere;margin:8px 0;color:#555}button{padding:7px 10px;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.help{color:#666;font-size:12px}#status{color:#a33}
</style><body>
<h1>DiscoJ 현재곡 연결</h1>
<div id="connection" role="status" aria-live="polite">연결 상태 확인 중…</div>
<p id="title" hidden></p>
<p class="help">스피커로 재생할 유튜브 탭을 연결하세요.</p>
<button id="connect" disabled>이 탭 연결</button> <button id="disconnect" disabled>연결 해제</button>
<p id="status" role="alert"></p><script src="popup.js"></script></body></html>
