<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디스코제이</title></head>
<body><main>
<header><h1>디스코제이</h1><span id="connection" role="status">연결 중</span></header>
<div class="feedback"><p id="notice" role="status" aria-live="polite">Discord 인증 중…</p><button id="reconnect" hidden>다시 연결</button></div>
<div class="workspace">
<section class="player" aria-labelledby="current-heading">
  <div class="section-head"><h2 id="current-heading">지금 듣는 곡</h2><span id="play-state">확인 중</span></div>
  <div class="track-info"><div class="record" aria-hidden="true"><span></span></div><div class="track-copy"><h3 id="title">재생 정보 확인 중</h3><button id="video-link" class="text-button" hidden>영상 열기 ↗</button></div></div>
  <div class="transport" role="group" aria-label="재생 컨트롤">
    <button data-action="previous" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 8 12l11 7Z"/></svg><span>이전곡</span></button>
    <button data-action="play" class="primary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>재생</span></button>
    <button data-action="pause" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span>일시정지</span></button>
    <button data-action="next" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7-11 7Z"/></svg><span>다음곡</span></button>
  </div>
  <form id="volume-form"><label for="volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5 5 9H2v6h3l5 4ZM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/></svg><span>유튜브 음량</span></label><div class="volume-row"><input id="volume" type="range" min="0" max="100" step="1" value="100" disabled><output id="volume-value" for="volume">100%</output><button id="volume-apply" disabled>적용</button></div></form>
</section>
<section class="queue" aria-labelledby="queue-heading"><div class="section-head"><h2 id="queue-heading">재생목록 <span id="total">0곡</span></h2><button id="refresh" class="text-button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-3l2 3M19 16a8 8 0 0 1-13 3l-2-3"/></svg>새로고침</button></div>
<form id="add-form"><input id="add-link" type="url" aria-label="추가할 유튜브 영상 링크" placeholder="유튜브 링크로 곡 추가" maxlength="2048" autocomplete="off" required disabled><button id="add-submit" disabled>추가</button></form>
<ol id="tracks"></ol><p id="empty" hidden>재생목록이 비어 있어요.</p><button id="playlist-link" class="text-button" hidden>유튜브 재생목록 열기 ↗</button></section>
</div>
</main>
<dialog id="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-title delete-note">
<h2 id="delete-heading">이 곡을 삭제할까요?</h2><p id="delete-title"></p><p id="delete-note"></p>
<p id="delete-error" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="delete-cancel" type="button" autofocus>취소</button><button id="delete-confirm" type="button">삭제</button></div>
</dialog>
<script type="module" src="/main.js"></script></body></html>
