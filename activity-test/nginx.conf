server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://host.docker.internal:18768;
        proxy_pass $backend;
        proxy_read_timeout 50s;
        proxy_buffering off;
        client_max_body_size 4k;
    }
    # YouTube thumbnails through our origin (Discord's CSP blocks i.ytimg.com).
    # Only an 11-character video ID is accepted, so this is not an open proxy.
    location ~ "^/thumb/([A-Za-z0-9_-]{11})$" {
        resolver 127.0.0.11 valid=300s;
        set $video $1;
        proxy_pass https://i.ytimg.com/vi/$video/mqdefault.jpg;
        proxy_ssl_server_name on;
        proxy_set_header Host i.ytimg.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 8s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location / { try_files $uri $uri/ =404; }
}
