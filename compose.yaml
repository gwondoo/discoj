services:
  discoj:
    build: .
    env_file: .env
    environment:
      PLAYBACK_HOST: 0.0.0.0
      ACTIVITY_HOST: 0.0.0.0
      HOST_LAUNCH_URL: http://host.docker.internal:18769
    ports:
      - "127.0.0.1:18766:18766"
      - "127.0.0.1:18768:18768"
    restart: unless-stopped
    init: true
    volumes:
      - discoj_data:/app/data

volumes:
  discoj_data:
